name: linux packages

on:
  pull_request:
    branches: ["release/**"]
    paths:
      - ".github/workflows/linux.yml"
      - "crates/adapters/updater/**"
      - "crates/shell-linux/**"
      - "engine/webkit/webkit.pin"
      - "tools/packaging/linux/**"
  workflow_dispatch:
    inputs:
      version:
        description: Package version (X.Y.Z)
        type: string
        required: true
        default: "0.2.0"
      webkit_commit:
        description: Optional fork commit for a preview test
        type: string
        required: false
      webkit_api_tests:
        description: Run sandboxed native WebKitGTK API tests on Ubuntu
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
      release_notes:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.ref }}
  # Let an active WebKitGTK compile finish and save its cache for the queued revision.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.build/gtk-ccache
  CCACHE_MAXSIZE: 3G
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  QUICKIE_MIN_FREE_GB: "25"
  QUICKIE_WEBKIT_COMMIT: ${{ inputs.webkit_commit }}
  QUICKIE_VERSION: ${{ inputs.version || '0.2.0' }}

jobs:
  ubuntu:
    name: Ubuntu 24.04 (deb and AppImage)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # jdx/mise-action v5.2.9
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          install_args: rust
      - name: Install build dependencies
        run: bash tools/packaging/linux/dist/dependencies ubuntu
      - name: Prepare Bubblewrap for the native WebKitGTK tests
        if: inputs.webkit_api_tests
        run: |
          if ! bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc /usr/bin/true; then
            profile=$(dpkg-query --listfiles apparmor-profiles | awk '/\/bwrap-userns-restrict$/ { print; exit }')
            test -n "$profile"
            sudo apparmor_parser --replace "$profile"
            bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc /usr/bin/true
          fi
      # actions/cache v5
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: engine-cache
        with:
          path: .build/gtk-ccache
          key: webkitgtk-ubuntu24-x64-${{ inputs.webkit_commit || hashFiles('engine/webkit/webkit.pin') }}-${{ hashFiles('tools/packaging/linux/build-engine', 'tools/packaging/linux/dist/dependencies') }}
          restore-keys: webkitgtk-ubuntu24-x64-
      - name: Build pinned WebKitGTK
        env:
          # WebKit uses clang::suppress on function declarations.
          CC: clang-20
          CXX: clang++-20
          QUICKIE_RUN_GTK_NATIVE_TESTS: ${{ inputs.webkit_api_tests && '1' || '0' }}
        run: bash tools/packaging/linux/build-engine
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always() && steps.engine-cache.outputs.cache-matched-key != steps.engine-cache.outputs.cache-primary-key && steps.engine-cache.outputs.cache-primary-key != ''
        with:
          path: .build/gtk-ccache
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.release_notes
        with:
          name: quickie-release-notes
          path: .build/release-notes
      - name: Build Quickie, the deb and the AppImage
        env:
          QUICKIE_RELEASE_NOTES: ${{ inputs.release_notes && format('{0}/.build/release-notes/ReleaseNotes.md', github.workspace) || '' }}
        run: bash tools/packaging/linux/package deb-and-appimage "$QUICKIE_VERSION"
      - name: Rehearse native DEB and AppImage updates
        run: |
          sudo apt-get install -y --no-install-recommends squashfs-tools
          bash tools/packaging/linux/tests/update-rehearsal deb-and-appimage "$QUICKIE_VERSION"
      - name: Checksums
        working-directory: .build/gtk-packages
        run: sha256sum ./*.deb ./*.AppImage > SHA256SUMS.ubuntu
      # actions/upload-artifact v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quickie-linux-ubuntu
          path: .build/gtk-packages/*
          if-no-files-found: error
          compression-level: 0

  fedora:
    name: Fedora 43 (rpm)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: fedora:43
    steps:
      - name: Install build dependencies
        run: bash -c 'dnf -y install git tar gzip which xz curl-minimal'
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # jdx/mise-action v5.2.9
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          install_args: rust
      - name: Install WebKit dependencies
        run: bash tools/packaging/linux/dist/dependencies fedora
      # actions/cache v5
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: engine-cache
        with:
          path: .build/gtk-ccache
          key: webkitgtk-fedora43-x64-${{ inputs.webkit_commit || hashFiles('engine/webkit/webkit.pin') }}-${{ hashFiles('tools/packaging/linux/build-engine', 'tools/packaging/linux/dist/dependencies') }}
          restore-keys: webkitgtk-fedora43-x64-
      - name: Build pinned WebKitGTK
        run: bash tools/packaging/linux/build-engine
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always() && steps.engine-cache.outputs.cache-matched-key != steps.engine-cache.outputs.cache-primary-key && steps.engine-cache.outputs.cache-primary-key != ''
        with:
          path: .build/gtk-ccache
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.release_notes
        with:
          name: quickie-release-notes
          path: .build/release-notes
      - name: Build Quickie and the rpm
        env:
          QUICKIE_RELEASE_NOTES: ${{ inputs.release_notes && format('{0}/.build/release-notes/ReleaseNotes.md', github.workspace) || '' }}
        run: bash tools/packaging/linux/package rpm "$QUICKIE_VERSION"
      - name: Rehearse native RPM updates
        run: bash tools/packaging/linux/tests/update-rehearsal rpm "$QUICKIE_VERSION"
      - name: Checksums
        working-directory: .build/gtk-packages
        run: sha256sum ./*.rpm > SHA256SUMS.fedora
      # actions/upload-artifact v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quickie-linux-fedora
          path: .build/gtk-packages/*
          if-no-files-found: error
          compression-level: 0

  ubuntu-smoke:
    name: Ubuntu 24.04 smoke (deb and AppImage)
    needs: ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: quickie-linux-ubuntu
          path: .build/gtk-packages
      - name: Install the deb and prepare the runner
        run: |
          (cd .build/gtk-packages && sha256sum --check SHA256SUMS.ubuntu)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor-profiles dbus-x11 xauth xvfb \
            sway grim wtype wl-clipboard python3-pil \
            "$PWD/.build/gtk-packages/quickie_${QUICKIE_VERSION}_amd64.deb"
          if ! bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc /usr/bin/true; then
            profile=$(dpkg-query --listfiles apparmor-profiles | awk '/\/bwrap-userns-restrict$/ { print; exit }')
            test -n "$profile"
            sudo apparmor_parser --replace "$profile"
            bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc /usr/bin/true
          fi
      - name: Run real browsers from both archives
        run: |
          unset WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS
          check_package() {
            local binary=$1 package=$2
            test "$("$binary" --version)" = "$QUICKIE_VERSION"
            bash tools/packaging/linux/tests/smoke "$binary"
            dbus-run-session -- /usr/bin/python3 -B tools/packaging/linux/stories/driver.py \
              "$binary" "$RUNNER_TEMP/quickie-gtk-stories/$package" \
              --backend wayland --group inspector --group tabs --group hints --group origin \
              --group privacy --group library --group toasts
          }
          check_package /usr/bin/quickie deb
          appimage="$PWD/.build/gtk-packages/Quickie-${QUICKIE_VERSION}-x86_64.AppImage"
          chmod +x "$appimage"
          if [[ -c /dev/fuse && -r /dev/fuse && -w /dev/fuse ]]; then
            check_package "$appimage" appimage
          else
            APPIMAGE_EXTRACT_AND_RUN=1 check_package "$appimage" appimage
          fi
      # actions/upload-artifact v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gtk-wayland-ubuntu
          path: ${{ runner.temp }}/quickie-gtk-stories
          if-no-files-found: ignore

  fedora-smoke:
    name: Fedora 43 smoke (rpm)
    needs: fedora
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: quickie-linux-fedora
          path: .build/gtk-packages
      - name: Load the distribution Bubblewrap profile on the runner
        run: |
          (cd .build/gtk-packages && sha256sum --check SHA256SUMS.fedora)
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apparmor-profiles
          profile=$(dpkg-query --listfiles apparmor-profiles | awk '/\/bwrap-userns-restrict$/ { print; exit }')
          test -n "$profile"
          sudo apparmor_parser --replace "$profile"
      - name: Run the installed rpm as an unprivileged user
        run: |
          install -d -m0755 "$RUNNER_TEMP/quickie-gtk-stories"
          docker run --rm --privileged \
            --env QUICKIE_VERSION \
            --volume "$PWD/.build/gtk-packages:/packages:ro" \
            --volume "$PWD/tools/packaging/linux/tests:/tests:ro" \
            --volume "$PWD/tools/packaging/linux/stories:/stories:ro" \
            --volume "$RUNNER_TEMP/quickie-gtk-stories:/captures" \
            fedora:43 bash -c '
              set -euo pipefail
              unset WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS
              dnf -y install /packages/*.rpm dbus-daemon python3 shadow-utils util-linux \
                xorg-x11-server-Xvfb xorg-x11-xauth sway grim wtype wl-clipboard python3-pillow
              useradd --create-home quickie-test
              install -d -o quickie-test /captures/rpm
              test "$(runuser -u quickie-test -- /usr/bin/quickie --version)" = "$QUICKIE_VERSION"
              runuser -u quickie-test -- bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc /usr/bin/true
              runuser -u quickie-test -- bash /tests/smoke /usr/bin/quickie
              runuser -u quickie-test -- dbus-run-session -- /usr/bin/python3 -B /stories/driver.py \
                /usr/bin/quickie /captures/rpm \
                --backend wayland --group inspector --group tabs --group hints --group origin \
                --group privacy --group library --group toasts
            '
      # actions/upload-artifact v7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: gtk-wayland-fedora
          path: ${{ runner.temp }}/quickie-gtk-stories
          if-no-files-found: ignore
