name: webkit

# Builds our WebKit fork at the commit in engine/webkit/webkit.pin and publishes the frameworks as
# an artifact with a sha256 and a build provenance attestation, both made by the job that built
# them. The engine is built here only, never on a developer's machine (engine/README.md). A manual
# run may build another fork commit instead (the `commit` input), to test a patch branch before
# it is merged and pinned (engine/README.md, "Building a patch branch").

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (macos-26 has Xcode 26; xcode-27 is macOS 27 with Xcode 27)
        default: macos-26
        type: string
      xcode:
        description: Xcode to select, by its path under /Applications
        default: Xcode_26.6.app
        type: string
      commit:
        description: Fork commit to build instead of the pin (40 hex characters; empty builds the pin)
        default: ""
        type: string
      rebuild:
        description: Build even when the webkit-<commit12> prerelease already holds this commit's build
        default: false
        type: boolean
  push:
    branches: [main, "release/**"]
    paths:
      - engine/webkit/**
      - .github/workflows/webkit.yml
      - .github/scripts/free-disk-macos.sh

permissions: {}

# Per commit, so manual runs for different patch branches do not cancel each other.
concurrency:
  group: webkit-${{ github.ref }}-${{ inputs.commit || 'pin' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # A build takes hours even from the compilation cache; a commit already kept as the
  # webkit-<commit12> prerelease (the Keep step) is not built again, as when only this workflow
  # changed. A manual run of another commit, or with `rebuild`, always builds.
  needed:
    name: build needed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: engine/webkit/webkit.pin
      - name: Check the kept builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          commit=${COMMIT:-$(sed -n 's/^WEBKIT_COMMIT=//p' engine/webkit/webkit.pin)}
          tag="webkit-${commit:0:12}"
          if [ "$REBUILD" != true ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.tar\.gz$'; then
            echo "$tag holds this commit's build already; nothing to build" >>"$GITHUB_STEP_SUMMARY"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  webkit-macos:
    name: webkit (macOS arm64)
    needs: needed
    if: needs.needed.outputs.build == 'true'
    # macos-26: macOS 26 with Xcode 26 on arm64 (Apple silicon), free for public repositories.
    # The fork follows the webkitglib/2.54 series, whose Cocoa code does not build against the
    # macOS 27 SDK (Xcode 27); frameworks built with SDK 26 run on macOS 26 and 27. Move to
    # xcode-27 together with a series that builds there.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # The hosted-runner limit is 6 h; the build step stops itself earlier (QUICKIE_BUILD_MINUTES)
    # to leave time for packaging and for the logs.
    timeout-minutes: 355
    permissions:
      # write: the Keep step's prerelease.
      contents: write
      id-token: write
      attestations: write
    env:
      CI: "true"
      XCODE_APP: ${{ inputs.xcode || 'Xcode_26.6.app' }}
      # Read by sync, which checks it like the pin; empty builds the pin.
      QUICKIE_WEBKIT_COMMIT: ${{ inputs.commit }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version
          sw_vers
          for tool in python3 ruby perl git; do printf '%s: %s\n' "$tool" "$(command -v "$tool")"; done

      - name: Free disk
        run: |
          df -h /
          .github/scripts/free-disk-macos.sh
          df -h /

      # Xcode 26 and later ship without the Metal compiler; WebCore and WebGPU compile shaders.
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Sync
        run: engine/webkit/scripts/sync

      # Xcode's compilation cache (.build/webkit-cas, ~5 GB) carries compiled objects from one run
      # to the next: a rebuild of the same pin, or of a pin a few patches on, is mostly cache hits.
      # WebKitBuild (~9 GB) is not kept: both would not fit the repository's 10 GB of caches.
      # Keys are per runner and Xcode (objects from another compiler are useless) and unique per
      # run, so every run saves what it compiled, even a failed or timed-out one, and the next run
      # restores the newest; GitHub evicts the oldest past 10 GB. The prefix leaves the commit out,
      # so a patch branch's build restores what its base compiled.
      - name: Cache key
        id: cas
        run: |
          prefix="webkit-cas-${RUNNER_LABEL}-${XCODE_APP%.app}-"
          commit=$(git -C .build/webkit rev-parse 'HEAD^{commit}')
          echo "prefix=$prefix" >>"$GITHUB_OUTPUT"
          echo "key=$prefix${commit:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
        env:
          RUNNER_LABEL: ${{ inputs.runner || 'macos-26' }}

      # actions/cache/restore v6.1.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/webkit-cas
          key: ${{ steps.cas.outputs.key }}
          restore-keys: ${{ steps.cas.outputs.prefix }}

      - name: Build
        env:
          QUICKIE_BUILD_MINUTES: "300"
        run: engine/webkit/scripts/build

      # actions/cache/save v6.1.0
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: always() && steps.cas.outputs.key != ''
        with:
          path: .build/webkit-cas
          key: ${{ steps.cas.outputs.key }}

      - name: Package
        id: package
        run: engine/webkit/scripts/package "$RUNNER_TEMP/webkit"

      # The attestation names the archive's sha256 and this workflow run; check it with
      # `gh attestation verify <archive> --repo izevg/quickie`.
      # actions/attest-build-provenance v4.2.2
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ runner.temp }}/webkit
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      # Artifacts expire; the app is built from this archive for as long as the pin names it
      # (engine/webkit/scripts/fetch). A pushed branch's build is kept as the assets of the
      # `webkit-<commit12>` prerelease; a manual run of another commit stays an artifact only.
      - name: Keep
        if: github.event_name == 'push' || inputs.commit == ''
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          tag="webkit-${NAME##*-}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "WebKit fork ${NAME##*-}" \
              --notes "Our WebKit fork built at izevg/WebKit@${NAME##*-} (engine/webkit/webkit.pin), for engine/webkit/scripts/fetch. Not a Quickie release."
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Summary
        if: always()
        run: |
          {
            echo '### WebKit (macOS arm64)'
            echo '```'
            echo "webkit commit: $(git -C .build/webkit rev-parse 'HEAD^{commit}' 2>/dev/null || echo none)"
            echo "override: ${QUICKIE_WEBKIT_COMMIT:-none (the pin)}"
            df -h /
            cat "$RUNNER_TEMP"/webkit/*.sha256 2>/dev/null || echo 'no archive'
            ls -lh "$RUNNER_TEMP"/webkit 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          gzip -c .build/webkit-build.log >"$RUNNER_TEMP/webkit-build.log.gz" 2>/dev/null || true

      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: webkit-macos-build-log
          path: ${{ runner.temp }}/webkit-build.log.gz
          if-no-files-found: ignore
          retention-days: 14

  # webkit-linux (planned, not enabled): WebKitGTK from the same pin, as a first-class target.
  #
  #   runs-on: ubuntu-24.04 (x86_64) and ubuntu-24.04-arm (arm64), both free for public
  #     repositories (4 CPUs, 16 GB RAM, ~14 GB free before cleanup)
  #   free disk: remove /usr/local/lib/android, /usr/share/dotnet, /opt/ghc, /opt/hostedtoolcache
  #     (as the macOS job does)
  #   sync: engine/webkit/scripts/sync (portable POSIX sh, same sparse checkout)
  #   deps: the WebKit SDK container (Tools/Scripts/container-sdk, `wkdev-sdk`) pinned by digest,
  #     or Tools/gtk/install-dependencies on the runner; the container is the reproducible choice
  #   build: Tools/Scripts/build-webkit --gtk --release --cmakeargs="-DENABLE_DOCUMENTATION=OFF
  #     -DENABLE_INTROSPECTION=OFF -DENABLE_MINIBROWSER=OFF -DENABLE_API_TESTS=OFF
  #     -DUSE_LIBBACKTRACE=OFF -DDEVELOPER_MODE=OFF", ninja, no debug info (-g0)
  #   package: `ninja install` into a staging prefix (libwebkitgtk-6.0.so, libjavascriptcoregtk-6.0.so,
  #     the WebKitWebProcess/WebKitNetworkProcess/WebKitGPUProcess helpers, injected-bundle dir),
  #     tar.gz + sha256 + attestation from the same job, like webkit-macos
