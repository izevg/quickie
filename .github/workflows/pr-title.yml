name: pr-title

# Pull requests are squash merged and the PR title becomes the commit on main, which the release
# versioning reads (.github/cliff.toml). So the title must be a Conventional Commit:
#   type(optional-scope)!: description
# Plain bash instead of a third-party action: the title goes through an env var, never into the
# script text, and the workflow holds no token beyond read access.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|perf|docs|chore|ci|test|refactor|style|build'
          if printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9._/-]+\))?!?: [^[:space:]].*$"; then
            echo "ok: $TITLE"
          else
            echo "::error title=Pull request title::'$TITLE' is not a Conventional Commit. Use 'type(scope)!: description' with type one of: ${types//|/, }."
            exit 1
          fi
