name: ci

# The gates of docs/quality.md on main, release branches, and every pull request. The tasks come from
# .mise.toml, which stays the single source of truth; the hooks run the same tasks locally.

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  # Install only what each job lists; never compile cargo-mutants on the gates runner.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

defaults:
  run:
    shell: bash

jobs:
  gates:
    name: gates
    # The product is macOS-only; the AppKit crates build only there.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      # The whole history: the secret scan reads every commit.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # jdx/mise-action v5.2.9
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          install_args: >-
            rust aqua:tamasfe/taplo aqua:crate-ci/typos aqua:koalaman/shellcheck
            aqua:rhysd/actionlint aqua:gitleaks/gitleaks aqua:EmbarkStudios/cargo-deny
            github:bnjbvr/cargo-machete aqua:lycheeverse/lychee aqua:jqlang/jq
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Gates
        # Some Cargo commands replace binaries in the shared target directory.
        run: mise run --jobs 1 ci

  # The engine conformance suite (crates/application/src/engine/conformance) on real WKWebViews,
  # as its own status: an engine that stops behaving as the application expects fails here by
  # name. WebKit needs macOS and the runner's GUI session.
  conformance:
    name: engine conformance (WebKit)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # jdx/mise-action v5.2.9
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          install_args: rust
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Conformance suite on WebKit
        run: mise run conformance

  # The same suite on our WebKit fork at the pin, the engine the app ships with: a patch or a pin
  # bump that breaks what the application expects fails here. Release branches also check
  # performance with the same optimized conformance binary. The fork needs macOS 26.5.
  conformance-fork:
    name: engine conformance (WebKit fork)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      # read: the fork's build (a prerelease asset, else a workflow artifact) and its attestation.
      actions: read
      attestations: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # jdx/mise-action v5.2.9
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          install_args: rust aqua:jqlang/jq
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: WebKit fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: engine/webkit/scripts/fetch
      - name: Conformance suite on the fork
        env:
          QUICKIE_INSPECTOR_WINDOW_STORIES: "1"
          RELEASE_PERFORMANCE: >-
            ${{ startsWith(github.ref, 'refs/heads/release/') ||
                (github.event_name == 'pull_request' &&
                 (startsWith(github.base_ref, 'release/') ||
                  (github.base_ref == 'main' && startsWith(github.head_ref, 'release/')))) }}
        run: |
          if [[ "$RELEASE_PERFORMANCE" == true ]]; then
            mise run conformance-fork-release
          else
            mise run conformance-fork
          fi
      - name: Report fork conformance termination
        if: failure()
        run: |
          /usr/bin/vm_stat
          /usr/bin/log show --last 10m --style compact \
            --predicate 'eventMessage CONTAINS[c] "conformance" AND (process == "kernel" OR process == "amfid" OR process == "runningboardd")' \
            | tail -100 || true
          reports="$HOME/Library/Logs/DiagnosticReports"
          for report in "$reports"/conformance-*.ips; do
            [[ -f "$report" ]] || continue
            printf '%s\n' "${report##*/}"
            tail -n +2 "$report" | jq '{procName, exception, termination, vmSummary}' || true
          done

  # The UI stories (docs/quality.md, UI tests): every widget state rendered headless, its plays
  # run, and its render compared with the reference PNG. This runner is the references' source
  # of truth, so missing references or references from another macOS fail here (strict); the
  # renders and diffs are uploaded, and `cargo xtask ui accept --from <artifact>` takes them.
  # AppKit needs macOS; the Linux mutation job never builds the UI crates.
  ui:
    name: ui stories
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # jdx/mise-action v5.2.9
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          install_args: rust
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Stories (renders, plays, visual comparison)
        env:
          QUICKIE_UI_STRICT: "1"
        run: mise run ui
      # actions/upload-artifact v7.0.2
      - name: Renders and diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-renders
          path: target/ui
          retention-days: 14

  # Only on pull requests: mutate what the branch changed in domain and application. Any missed
  # mutant fails the job. The core is pure Rust, so a Linux runner is enough (and cheaper).
  # cargo-mutants builds and tests only the packages whose files it mutates (examine_globs in
  # .cargo/mutants.toml), so the conformance suite's logic is mutated against the in-memory
  # engine in quickie-application, and no engine adapter or its harness is built here.
  mutation:
    name: mutation (changed code)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # jdx/mise-action v5.2.9
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          install_args: rust cargo:cargo-mutants
      # Swatinem/rust-cache v2.9.3
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Mutate the changed code
        env:
          BASE: ${{ github.base_ref }}
        run: |
          mkdir -p target
          git diff "origin/$BASE...HEAD" > target/pr.diff
          if [ -s target/pr.diff ]; then
            cargo mutants --workspace -j 3 --in-diff target/pr.diff
          fi
