<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Quickie Inspector Fixture</title>
<style>
    :root { color: #eff7ff; background: #24384c; font: 16px system-ui, sans-serif; }
    body { margin: 24px; }
    #viewport-marker {
        position: fixed;
        inset: auto 10px 10px auto;
        width: 16px;
        height: 16px;
        background: #5fe2b0;
    }
</style>
<h1>Quickie Inspector Fixture</h1>
<div id="viewport-marker" aria-hidden="true"></div>
<script>
    function docked() { void fetch("?inspector=docked"); }
    function detached() { void fetch("?inspector=detached"); }
    addEventListener("keydown", (event) => {
        if (event.key.length === 1 && !event.ctrlKey && !event.altKey && !event.metaKey)
            void fetch("?page=typed");
    });
</script>
</html>
