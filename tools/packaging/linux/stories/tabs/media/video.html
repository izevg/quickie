<script>
  const video = document.querySelector("video");
  const play = document.querySelector("button");
  const report = state => fetch(`video.html?state=${state}`);
  if (new URLSearchParams(location.search).has("other")) {
    document.title = "Quickie other tab";
    document.documentElement.className = "other";
    document.querySelector("a").remove();
    play.remove();
    video.remove();
  } else {
    const clip = document.querySelector("#clip").textContent.replace(/\s/g, "");
    video.src = `data:video/webm;base64,${clip}`;
    video.addEventListener("playing", () => report("playing"));
    video.addEventListener("pause", () => report("paused"));
    video.addEventListener("timeupdate", () => {
      if (!video.paused && video.currentTime > 0) report("advanced");
      if (video.audioTracks?.length) report("audio");
    });
    video.addEventListener("error", () => report(`error-${video.error?.code}`));
    play.addEventListener("click", () => {
      video.play().catch(error => report(`play-${error.name}`));
    });
  }
</script>
