<!doctype html>
<meta charset="utf-8">
<title>Extension profile fixture</title>
<style>
  body { margin: 0; min-height: 100vh; background: rgb(116 68 98); color: white; font: 24px system-ui; }
  h1 { margin: 0; padding: 64px; }
</style>
<h1>Extension profile fixture</h1>
<script>
  addEventListener("load", () => {
    const phase = location.search === "?private" ? "private" : "ordinary";
    const marks = ["allowed", "disabled", "ungranted"].reduce((bits, key, index) =>
      bits | (document.documentElement.dataset[key] === "1" ? 1 << index : 0), 0);
    fetch(`/extension-result?phase=${phase}&markers=${marks}`);
  }, {once: true});
</script>
