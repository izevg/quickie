<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Origin fixture</title>
<style>
  html { min-height: 100%; background: #345577; }
  body { margin: 0; text-align: center; color: white; font: 22px system-ui, sans-serif; }
  #page { padding-top: 100px; }
  #under-chip { position: absolute; inset: 0 0 auto; width: 100%; height: 60px; opacity: 0; }
  a { display: inline-block; margin: 12px; color: white; }
</style>
<button id="under-chip" type="button">Confirm that the origin chip passes clicks through</button>
<div id="page">
  <a id="same" href="?page=same">Same origin</a>
  <a id="cross" href="?page=russian">Cross origin</a>
</div>
<script>
  const page = new URLSearchParams(location.search).get("page");
  if (page === "same") document.documentElement.style.background = "#604275";
  if (page === "russian") {
    document.documentElement.style.background = "#3d6f70";
    history.replaceState(null, "", "/wiki/Московский_Кремль");
  }
  const cross = new URL(document.querySelector("#cross").href);
  cross.hostname = "localhost";
  document.querySelector("#cross").href = cross.href;
  document.querySelector("#under-chip").onclick = () =>
    fetch("/tabs/origin/fixture.html?click=under-chip");
  document.addEventListener("keydown", event => {
    if (event.key === "f") document.documentElement.requestFullscreen();
  });
  document.addEventListener("fullscreenchange", () => {
    const state = document.fullscreenElement ? "enter" : "leave";
    fetch(`/tabs/origin/fixture.html?fullscreen=${state}`);
  });
</script>
</html>
