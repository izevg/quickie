[workspace]
resolver = "3"
# Add a glob here when its directory gets its first crate (crates/adapters/*, crates/ui/*, ...).
members = [
  "crates/domain/*",
  "crates/application",
  "crates/adapters/*",
  "crates/ui/*",
  "crates/shell",
  "crates/shell-linux",
  "tools/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Shields in the development engine: filter lists to WebKit content rule lists, and the cosmetic
# filters and scriptlets each site gets. MPL-2.0. The domain resolver (the public suffix list, by
# `addr` and `psl`, MIT OR Apache-2.0) is needed: parsing a `$to=` rule and looking up a site's
# cosmetic filters ask it, and without one they panic. CSS validation (`cssparser`, `selectors`,
# MPL-2.0; `precomputed-hash`, MIT) parses procedural filters (`:has-text()`, `:upward()`, ...)
# into their operators and refuses `:style()` declarations that could load anything; without it
# a procedural filter stays a CSS selector that never matches, and a style goes in unread.
# Request matching is WebKit's, so the regex handling for it stays out.
adblock = { version = "0.13.6", default-features = false, features = [
  "content-blocking",
  "css-validation",
  "embedded-domain-resolver",
] }
# The Chromium boundary (adapter engine-chromium). Pinned to the copy Chromium vendors at the
# version in engine/chromium/chromium.pin (third_party/rust/chromium_crates_io/vendor/cxx-v1), which GN
# builds against; bump both together.
cxx = "=1.0.202"
# Benchmarks of the hot paths (`benches/` of domain and application crates); a dev-dependency
# only, never in the product. MIT OR Apache-2.0.
divan = "0.1"
indexmap = "2"
# The matcher only: the high-level `nucleo` crate spawns worker threads, which the pure domain
# must not do.
nucleo-matcher = "0.3"
quickie-application = { path = "crates/application" }
quickie-domain-agents = { path = "crates/domain/agents" }
quickie-domain-browsing = { path = "crates/domain/browsing" }
quickie-domain-commands = { path = "crates/domain/commands" }
quickie-domain-kernel = { path = "crates/domain/kernel" }
quickie-domain-library = { path = "crates/domain/library" }
quickie-domain-palette = { path = "crates/domain/palette" }
quickie-domain-settings = { path = "crates/domain/settings" }
quickie-domain-shields = { path = "crates/domain/shields" }
rusqlite = { version = "0.43", features = ["bundled"] }
# The Keychain (adapter system), where LLM API keys live instead of files, and the signature
# checks of web extension packages. MIT OR Apache-2.0.
security-framework = "3.7"
# What security-framework leaves unwrapped for those checks: `SecKeyCreateWithData` and the
# Core Foundation values it takes. Already in the tree under security-framework; MIT OR
# Apache-2.0.
core-foundation = "0.10"
security-framework-sys = "2.17"
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2.5"
# AppKit, Core Animation and WebKit through objc2 (docs/architecture.md §1). Features are opted
# into per crate; the framework crates' defaults would compile every header.
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std"] }
# Workspace crates carry a version so that `cargo deny` does not read them as wildcards.
quickie-engine-chromium = { path = "crates/adapters/engine-chromium", version = "0.0.0" }
quickie-engine-webkit = { path = "crates/adapters/engine-webkit", version = "0.0.0" }
quickie-llm = { path = "crates/adapters/llm", version = "0.0.0" }
quickie-store = { path = "crates/adapters/store", version = "0.0.0" }
quickie-system = { path = "crates/adapters/system", version = "0.0.0" }
quickie-ui-screens = { path = "crates/ui/screens", version = "0.0.0" }
quickie-ui-shared = { path = "crates/ui/shared", version = "0.0.0" }
quickie-ui-widgets = { path = "crates/ui/widgets", version = "0.0.0" }

# Every crate opts in with `[lints] workspace = true`; `cargo xtask layers` checks that it does.
[workspace.lints.rust]
# Allowed per crate (`#![expect(unsafe_code, reason = "...")]`) only in adapters, ui and shell.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Exceptions are `#[expect(lint, reason = "...")]`: stated, and reported once they are stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The build to dogfood and ship: `cargo xtask bundle --release`. Panics still unwind: the
# write-behind store reports a writer thread that panicked as a failed write instead of losing
# the whole app (crates/adapters/store/src/write_behind.rs), and the agent's and the downloads'
# worker threads end the same way.
[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "debuginfo"

# Dependencies (SQLite, adblock, nucleo, url, idna, ...) optimized in development builds and
# tests; they are built once, and our own crates stay quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

# Used by cargo-mutants (.cargo/mutants.toml): no debug info, faster mutant builds. Each mutant is
# built once, so incremental state is only written, never reused.
[profile.mutants]
inherits = "dev"
debug = 0
incremental = false
