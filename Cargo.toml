[workspace]
resolver = "3"
# Add a glob here when its directory gets its first crate (crates/adapters/*, crates/ui/*, ...).
members = [
  "crates/domain/*",
  "crates/application",
  "crates/adapters/*",
  "crates/ui/*",
  "crates/shell",
  "tools/xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# The Chromium boundary (adapter engine-chromium). Pinned to the copy Chromium vendors at the
# version in engine/chromium.pin (third_party/rust/chromium_crates_io/vendor/cxx-v1), which GN
# builds against; bump both together.
cxx = "=1.0.202"
indexmap = "2"
# The matcher only: the high-level `nucleo` crate spawns worker threads, which the pure domain
# must not do.
nucleo-matcher = "0.3"
quickie-application = { path = "crates/application" }
quickie-domain-browsing = { path = "crates/domain/browsing" }
quickie-domain-commands = { path = "crates/domain/commands" }
quickie-domain-kernel = { path = "crates/domain/kernel" }
quickie-domain-library = { path = "crates/domain/library" }
quickie-domain-palette = { path = "crates/domain/palette" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2.5"
# AppKit, Core Animation and WebKit through objc2 (docs/architecture.md §1). Features are opted
# into per crate; the framework crates' defaults would compile every header.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std"] }
# Workspace crates carry a version so that `cargo deny` does not read them as wildcards.
quickie-engine-webkit = { path = "crates/adapters/engine-webkit", version = "0.0.0" }
quickie-store = { path = "crates/adapters/store", version = "0.0.0" }
quickie-ui-shared = { path = "crates/ui/shared", version = "0.0.0" }

# Every crate opts in with `[lints] workspace = true`; `cargo xtask layers` checks that it does.
[workspace.lints.rust]
# Allowed per crate (`#![expect(unsafe_code, reason = "...")]`) only in adapters, ui and shell.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# Exceptions are `#[expect(lint, reason = "...")]`: stated, and reported once they are stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Used by cargo-mutants (.cargo/mutants.toml): no debug info, faster mutant builds.
[profile.mutants]
inherits = "dev"
debug = 0
