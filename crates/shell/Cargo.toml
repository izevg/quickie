[package]
name = "quickie"
description = "Composition root of Quickie; for now the development app on the WebKit engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "block2",
  "objc2-core-foundation",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSEvent",
  "NSMenu",
  "NSMenuItem",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { workspace = true, features = [
  "block2",
  "NSArray",
  "NSBundle",
  "NSDate",
  "NSEnumerator",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSTimer",
  "NSURL",
] }
quickie-application.workspace = true
quickie-domain-browsing.workspace = true
quickie-domain-commands.workspace = true
quickie-domain-library.workspace = true
quickie-domain-shields.workspace = true
quickie-engine-webkit.workspace = true
quickie-store.workspace = true
quickie-ui-shared.workspace = true
quickie-ui-widgets.workspace = true
url.workspace = true

[lints]
workspace = true
