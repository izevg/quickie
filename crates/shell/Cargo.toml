[package]
name = "quickie"
description = "Composition root of Quickie; for now the development app on the WebKit engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The engine of the main profile's pages: exactly one. The composition root names it once
# (`MainEngine` in src/main.rs); the rest of the shell reaches it through the engine ports, so
# CI also checks the shell with `main-chromium` (`mise run engine-swap`).
[features]
default = ["main-webkit"]
main-webkit = ["dep:quickie-engine-webkit"]
# Without the engine's `chromium` feature: the bridge is compiled out and every engine call
# fails as unavailable, which is enough to prove the shell names no WebKit type.
main-chromium = ["dep:quickie-engine-chromium"]

[dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "block2",
  "objc2-core-foundation",
  "NSAlert",
  "NSApplication",
  "NSButton",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSMenu",
  "NSMenuItem",
  "NSOpenPanel",
  "NSPanel",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSSavePanel",
  "NSScrollView",
  "NSText",
  "NSTextView",
  "NSTextInputClient",
  "NSTextInputContext",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { workspace = true, features = [
  "block2",
  "NSArray",
  "NSAttributedString",
  "NSBundle",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "FoundationErrors",
  "NSFileManager",
  "NSGeometry",
  "NSNotification",
  "NSOperation",
  "NSPathUtilities",
  "NSProcessInfo",
  "NSPropertyList",
  "NSString",
  "NSTimer",
  "NSURL",
  "NSUserDefaults",
  "NSValue",
] }
quickie-application.workspace = true
quickie-domain-agents.workspace = true
quickie-domain-browsing.workspace = true
quickie-domain-commands.workspace = true
quickie-domain-library.workspace = true
quickie-domain-settings.workspace = true
quickie-domain-shields.workspace = true
quickie-engine-chromium = { workspace = true, optional = true }
quickie-engine-webkit = { workspace = true, optional = true }
quickie-llm.workspace = true
quickie-store.workspace = true
quickie-system.workspace = true
quickie-ui-screens.workspace = true
quickie-ui-shared.workspace = true
quickie-ui-widgets.workspace = true
quickie-updater.workspace = true
tempfile.workspace = true
url.workspace = true

[lints]
workspace = true
