[package]
name = "quickie-ui-widgets"
description = "FSD widgets layer of Quickie's UI: the command palette, the address overlay, the tab switcher and overview, the toast stack, the find bar, the origin chip, the load progress line, link hints, and the downloads and shields popovers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-quartz-core",
  "NSBox",
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSClickGestureRecognizer",
  "NSColor",
  "NSControl",
  "NSGestureRecognizer",
  "NSGraphics",
  "NSImage",
  "NSImageView",
  "NSParagraphStyle",
  "NSProgressIndicator",
  "NSResponder",
  "NSStringDrawing",
  "NSText",
  "NSTextField",
  "NSTextInputClient",
  "NSTextView",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-foundation = { workspace = true, features = [
  "block2",
  "NSDate",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSRange",
  "NSString",
  "NSTimer",
] }
objc2-quartz-core = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-core-graphics",
  "CALayer",
  "CAMediaTimingFunction",
  "CATextLayer",
  "CATransaction",
  "CATransform3D",
] }
quickie-application.workspace = true
quickie-domain-browsing.workspace = true
quickie-domain-library.workspace = true
quickie-domain-shields.workspace = true
quickie-ui-shared.workspace = true

[dev-dependencies]
quickie-domain-palette.workspace = true
url.workspace = true

[lints]
workspace = true
