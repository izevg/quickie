[package]
name = "quickie-ui-widgets"
description = "FSD widgets layer of Quickie's UI: the command palette, the address overlay, the tab switcher, the toast stack, the find bar, the origin chip, and the load progress line"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-quartz-core",
  "NSButton",
  "NSCell",
  "NSColor",
  "NSControl",
  "NSGraphics",
  "NSImage",
  "NSImageView",
  "NSParagraphStyle",
  "NSResponder",
  "NSText",
  "NSTextField",
  "NSTextInputClient",
  "NSTextView",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-quartz-core = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-core-graphics",
  "CALayer",
  "CAMediaTimingFunction",
  "CATransaction",
  "CATransform3D",
] }
objc2-foundation = { workspace = true, features = [
  "block2",
  "NSDate",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSRange",
  "NSString",
  "NSTimer",
] }
quickie-application.workspace = true
quickie-domain-browsing.workspace = true
quickie-ui-shared.workspace = true

[dev-dependencies]
quickie-domain-palette.workspace = true
url.workspace = true

[lints]
workspace = true
