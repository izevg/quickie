[package]
name = "quickie-ui-widgets"
description = "FSD widgets layer of Quickie's UI: the command palette, the address overlay, the tab switcher and overview, the mini player, the toast stack, the find bar, the origin chip, the page frame and its load glow, link hints, the downloads and shields popovers, the full-screen notice, the dialog and permission sheets, and the agent's answer panel, badge, and settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-quartz-core",
  "NSAttributedString",
  "NSBox",
  "NSButton",
  "NSButtonCell",
  "NSCell",
  "NSClickGestureRecognizer",
  "NSClipView",
  "NSColor",
  "NSComboBox",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSFontDescriptor",
  "NSGestureRecognizer",
  "NSGraphics",
  "NSImage",
  "NSImageView",
  "NSParagraphStyle",
  "NSProgressIndicator",
  "NSResponder",
  "NSScrollView",
  "NSSecureTextField",
  "NSStringDrawing",
  "NSText",
  "NSTextContainer",
  "NSTextField",
  "NSTextFieldCell",
  "NSTextInputClient",
  "NSTextStorage",
  "NSTextView",
  "NSView",
  "NSWindow",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGPath"] }
objc2-foundation = { workspace = true, features = [
  "block2",
  "NSAttributedString",
  "NSDate",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSOperation",
  "NSRange",
  "NSString",
  "NSTimer",
  "NSURL",
  "NSValue",
] }
objc2-quartz-core = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-core-graphics",
  "CAAnimation",
  "CABase",
  "CAGradientLayer",
  "CALayer",
  "CAMediaTiming",
  "CAMediaTimingFunction",
  "CAShapeLayer",
  "CATextLayer",
  "CATransaction",
  "CATransform3D",
] }
quickie-application.workspace = true
quickie-domain-agents.workspace = true
quickie-domain-browsing.workspace = true
quickie-domain-library.workspace = true
quickie-domain-palette.workspace = true
quickie-domain-shields.workspace = true
quickie-ui-shared.workspace = true
url.workspace = true

[dev-dependencies]
quickie-domain-commands.workspace = true
quickie-ui-shared = { workspace = true, features = ["stories"] }

# Every widget's stories: headless renders, visual tests, and play tests (docs/quality.md).
# Without the libtest harness, so AppKit runs on the main thread.
[[test]]
name = "stories"
harness = false

[lints]
workspace = true
