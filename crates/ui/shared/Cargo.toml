[package]
name = "quickie-ui-shared"
description = "FSD shared layer of Quickie's UI: design tokens, glass surfaces by elevation, motion"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-quartz-core",
  "NSAccessibility",
  "NSColor",
  "NSFont",
  "NSFontDescriptor",
  "NSGlassEffectView",
  "NSResponder",
  "NSView",
  "NSVisualEffectView",
  "NSWorkspace",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGPath"] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDictionary",
  "NSGeometry",
  "NSString",
  "NSValue",
] }
objc2-quartz-core = { workspace = true, features = [
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "CAAnimation",
  "CALayer",
  "CAMediaTiming",
  "CAMediaTimingFunction",
  "CAShapeLayer",
  "CATransform3D",
  "CATransaction",
] }

[lints]
workspace = true
