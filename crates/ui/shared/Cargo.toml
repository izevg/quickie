[package]
name = "quickie-ui-shared"
description = "FSD shared layer of Quickie's UI: design tokens, glass surfaces by elevation, motion, keycaps, pills, hint bars, and the list view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-quartz-core",
  "NSAccessibility",
  "NSAccessibilityProtocols",
  "NSAttributedString",
  "NSButton",
  "NSCell",
  "NSClipView",
  "NSColor",
  "NSControl",
  "NSFont",
  "NSFontDescriptor",
  "NSGlassEffectView",
  "NSImage",
  "NSImageView",
  "NSLayoutConstraint",
  "NSParagraphStyle",
  "NSResponder",
  "NSScroller",
  "NSScrollView",
  "NSSwitch",
  "NSTableColumn",
  "NSTableHeaderView",
  "NSTableView",
  "NSText",
  "NSTextField",
  "NSUserInterfaceItemIdentification",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGPath"] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSAttributedString",
  "NSDictionary",
  "NSGeometry",
  "NSIndexSet",
  "NSObject",
  "NSRange",
  "NSString",
  "NSValue",
] }
objc2-quartz-core = { workspace = true, features = [
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "CAAnimation",
  "CALayer",
  "CAMediaTiming",
  "CAMediaTimingFunction",
  "CAShapeLayer",
  "CATransform3D",
  "CATransaction",
] }

[features]
# The story harness (`stories`): headless renders, visual tests, and play tests of the UI
# (docs/quality.md, UI tests). Only the UI crates' story tests turn it on; the product never does.
stories = [
  "objc2-app-kit/block2",
  "objc2-app-kit/NSAccessibilityConstants",
  "objc2-app-kit/NSAppearance",
  "objc2-app-kit/NSApplication",
  "objc2-app-kit/NSBitmapImageRep",
  "objc2-app-kit/NSColorSpace",
  "objc2-app-kit/NSEvent",
  "objc2-app-kit/NSGraphics",
  "objc2-app-kit/NSGraphicsContext",
  "objc2-app-kit/NSImageRep",
  "objc2-app-kit/NSRunningApplication",
  "objc2-foundation/NSData",
  "objc2-foundation/NSProcessInfo",
]

[lints]
workspace = true
