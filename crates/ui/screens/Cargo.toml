[package]
name = "quickie-ui-screens"
description = "FSD screens layer of Quickie's UI: the Settings window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "objc2-core-foundation",
  "NSAnimationContext",
  "NSBezierPath",
  "NSBox",
  "NSButton",
  "NSCell",
  "NSClipView",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSFont",
  "NSGraphics",
  "NSImage",
  "NSImageView",
  "NSResponder",
  "NSScrollView",
  "NSSearchField",
  "NSTableColumn",
  "NSTableRowView",
  "NSTableView",
  "NSText",
  "NSTextField",
  "NSTextFieldCell",
  "NSTextView",
  "NSUserInterfaceItemIdentification",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }
objc2-foundation = { workspace = true, features = [
  "NSGeometry",
  "NSIndexSet",
  "NSNotification",
  "NSObject",
  "NSRange",
  "NSString",
] }
quickie-application.workspace = true
quickie-domain-commands.workspace = true
quickie-domain-shields.workspace = true
quickie-ui-shared.workspace = true
quickie-ui-widgets.workspace = true

[dev-dependencies]
quickie-ui-shared = { workspace = true, features = ["stories"] }

# The Settings panes' stories: headless renders, visual tests, and play tests
# (docs/quality.md). Without the libtest harness, so AppKit runs on the main thread.
[[test]]
name = "stories"
harness = false

[lints]
workspace = true
