[package]
name = "quickie-system"
description = "System adapter of Quickie: the macOS Keychain, where LLM API keys live instead of files, and web extension packages checked with the system's cryptography"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
quickie-application.workspace = true
quickie-domain-settings.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
quickie-domain-agents.workspace = true
security-framework.workspace = true
security-framework-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
openssl = "0.10"
tempfile.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
