[package]
name = "quickie-engine-webkit"
description = "Development engine of Quickie: pages on WKWebView, until the Chromium engine exists"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSGraphics", "NSResponder", "NSView"] }
objc2-foundation = { workspace = true, features = [
  "block2",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSKeyValueObserving",
  "NSRunLoop",
  "NSString",
  "NSURL",
  "NSURLRequest",
  "NSURLResponse",
  "NSValue",
] }
objc2-web-kit = { workspace = true, features = [
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKNavigation",
  "WKNavigationDelegate",
  "WKPreferences",
  "WKURLSchemeHandler",
  "WKURLSchemeTask",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
] }
quickie-application.workspace = true
quickie-domain-browsing.workspace = true
url.workspace = true

[lints]
workspace = true
