[package]
name = "quickie-engine-webkit"
description = "Development engine of Quickie: pages on WKWebView, its content blocker, and NSURLSession, until the Chromium engine exists"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adblock.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
  "NSEvent",
  "NSGraphics",
  "NSImage",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-foundation = { workspace = true, features = [
  "block2",
  "NSArray",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSError",
  "NSGeometry",
  "NSKeyValueObserving",
  "NSOperation",
  "NSProgress",
  "NSRunLoop",
  "NSString",
  "NSTimer",
  "NSURL",
  "NSURLRequest",
  "NSURLResponse",
  "NSURLSession",
  "NSValue",
] }
objc2-web-kit = { workspace = true, features = [
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKContentRuleList",
  "WKContentRuleListStore",
  "WKContentWorld",
  "WKDownload",
  "WKDownloadDelegate",
  "WKFindConfiguration",
  "WKFindResult",
  "WKFrameInfo",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKPDFConfiguration",
  "WKPreferences",
  "WKScriptMessage",
  "WKScriptMessageHandler",
  "WKScriptMessageHandlerWithReply",
  "WKSecurityOrigin",
  "WKSnapshotConfiguration",
  "WKUIDelegate",
  "WKURLSchemeHandler",
  "WKURLSchemeTask",
  "WKUserContentController",
  "WKUserScript",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "WKWindowFeatures",
] }
quickie-application.workspace = true
quickie-domain-browsing.workspace = true
quickie-domain-shields.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
# The conformance test's native clicks; the thumbnails test reads pictures' pixels.
objc2-app-kit = { workspace = true, features = [
  "NSBitmapImageRep",
  "NSColor",
  "NSGraphicsContext",
  "NSImageRep",
] }
quickie-application = { workspace = true, features = ["conformance"] }
tempfile.workspace = true

# These drive real WKWebViews, so they run on the main thread with their own `main`, not the
# test harness's worker threads.
[[test]]
name = "blocking"
harness = false

# The application's engine conformance suite (crates/application/src/engine/conformance).
[[test]]
name = "conformance"
harness = false

# The tab overview's pictures: taken, sized, and dropped with their tabs.
[[test]]
name = "thumbnails"
harness = false

[lints]
workspace = true
