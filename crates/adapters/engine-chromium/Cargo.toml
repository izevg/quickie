[package]
name = "quickie-engine-chromium"
description = "Engine adapter on Chromium: EnginePort over the cxx bridge to //quickie"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Calls into the C++ side of the bridge. GN turns it on (engine/chromium/quickie/BUILD.gn); Cargo
# builds without it, because the C++ side exists only inside a Chromium checkout and would not link.
chromium = []

[dependencies]
cxx.workspace = true
# The shell hands each window's host view over as an NSView, which the engine keeps alive.
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSImage", "NSResponder", "NSView"] }
quickie-application.workspace = true
quickie-domain-browsing.workspace = true
quickie-domain-settings.workspace = true
url.workspace = true

[dev-dependencies]
quickie-application = { workspace = true, features = ["conformance"] }

[lints]
workspace = true
