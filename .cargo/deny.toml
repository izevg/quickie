# cargo-deny policy; run with `mise run deny`.

[graph]
all-features = true

[advisories]
# Vulnerabilities and yanked crates fail; unmaintained crates fail only when we depend on them directly.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive and weak-copyleft (file-level) only. No GPL/LGPL/AGPL: the product must stay
# combinable with Chromium (BSD-3) and ungoogled-chromium (BSD-3).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
