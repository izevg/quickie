# cargo-mutants settings; policy in docs/quality.md.
# Domain and application must kill every mutant. Add an `exclude_re` entry here, with the reason,
# only for a mutant that cannot be tested.

examine_globs = ["crates/domain/**/*.rs", "crates/application/**/*.rs"]
output = "target"
# Copy only what git tracks: agent worktrees under .claude/worktrees carry whole target dirs.
gitignore = true
profile = "mutants"
timeout_multiplier = 3
exclude_re = [
  # Uninhabited: no value of `NoExtensions` exists, so none of its methods can ever run.
  "<impl ExtensionHost for NoExtensions<P>>",
]
